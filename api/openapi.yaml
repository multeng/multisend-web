openapi: 3.1.1
info:
  title: TON Multisend API
  version: 0.5.1
  description:
    Testnet health, wallet authentication, private unfinished drafts and stateless payout
    preparation reports. No payout execution.
servers:
  - url: http://127.0.0.1:8080
    description: Local development; use a same-origin reverse proxy for deployment.
security: []
paths:
  /api/healthz:
    get:
      operationId: checkHealth
      summary: Check that the HTTP process is serving requests
      responses:
        '200':
          description: The process is alive, including before readiness and during drain.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: checkHealthHeaders
      summary: Check liveness without a response body
      responses:
        '200':
          description: Same status and headers as GET, with no response body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Type:
              $ref: '#/components/headers/JSONContentType'
  /api/readyz:
    get:
      operationId: checkReadiness
      summary: Check process initialization and PostgreSQL schema availability
      responses:
        '200':
          description: This process is serving and PostgreSQL/schema checks pass.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: Process is not initialized, is draining, or database/schema is unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReady'
    head:
      operationId: checkReadinessHeaders
      summary: Check readiness without a response body
      responses:
        '200':
          description: Ready; same headers as GET, with no response body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Type:
              $ref: '#/components/headers/JSONContentType'
        '503':
          description: Not ready; same headers as GET, with no response body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Type:
              $ref: '#/components/headers/JSONContentType'
  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: Read session state and establish anonymous CSRF/login state if needed
      security: []
      responses:
        '200':
          description: Current anonymous or authenticated browser session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        default: &a1
          $ref: '#/components/responses/APIFailure'
  /api/auth/challenge:
    post:
      operationId: createAuthChallenge
      summary: Create a single-use browser-bound five-minute challenge
      security: &a2
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Challenge ready before opening the wallet connection modal.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallenge'
        default: *a1
  /api/auth/verify:
    post:
      operationId: verifyWalletProof
      summary: Verify wallet ownership, consume the challenge and rotate the browser session
      description:
        Only testnet. Telegram wallets require active code-matching trusted current state. On
        persistence failure reset with logout/session before a new challenge; never replay the
        consumed proof.
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyProofRequest'
      responses:
        '200':
          description: Authenticated and durable server session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        default: *a1
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the login family and remove its browser session
      security: *a2
      responses:
        '204':
          description: Session family revoked and cookie removed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        default: *a1
  /api/drafts:
    get:
      operationId: listDrafts
      summary: List at most100 owned draft metadata records, newest update first
      security: &a4
        - sessionCookie: []
      responses:
        '200':
          description: Owned metadata only.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftList'
        default: &a3
          $ref: '#/components/responses/APIFailure'
    post:
      operationId: createDraft
      summary: Create an unfinished private draft
      security: &a5
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        description: Maximum JSON body64KiB. Storage limits are not payout limits.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInput'
      responses:
        '201':
          description: Durable draft.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftDetail'
        default: *a3
  /api/drafts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDraft
      summary: Read an owned draft; foreign and missing identifiers both return404
      security: *a4
      responses:
        '200':
          description: Owned draft.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftDetail'
        default: *a3
    put:
      operationId: updateDraft
      summary: Replace unfinished input only when the owned version matches
      security: *a5
      requestBody:
        required: true
        description: Maximum JSON body64KiB. Storage limits are not payout limits.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftUpdate'
      responses:
        '200':
          description: Saved with a new version;409 does not overwrite newer data.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftDetail'
        default: *a3
    delete:
      operationId: deleteDraft
      summary: Delete an owned draft only when its version matches
      security: *a5
      parameters:
        - name: version
          in: query
          required: true
          schema: &a6
            type: string
            pattern: ^[1-9][0-9]{0,17}$
      responses:
        '204':
          description: Deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        default: *a3
  /api/payouts/prepare:
    post:
      operationId: preparePayout
      summary: Validate a native testnet list and plan parts without executing
      description:
        Explicit authenticated report. Client-advertised maxMessages is an untrusted planning
        hint, not an authorization. Balances and network expenses are not checked. No database
        writes.
      security:
        - sessionCookie: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreparationInput'
      responses:
        '200':
          description:
            Static report only. Semantic errors return valid=false and no parts. No balances, fee
            estimate, authorization or stored package.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationReport'
        '400':
          description: Malformed input, missing fields or bounds violation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Authentication required or revoked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Exact Origin and CSRF required.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '405':
          description: Only POST is allowed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: Wallet sender or network does not match session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '413':
          description: JSON body exceeds64KiB.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '415':
          description: application/json required.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limited.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Session service unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /api/payouts/balance:
    get:
      operationId: readPayoutBalance
      summary: Read authenticated testnet wallet native balance
      security:
        - sessionCookie: []
      responses:
        '200':
          description:
            Fresh proof-verified snapshot for authenticated account; no caller address or recipient
            list.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceReport'
        '400':
          description: Query parameters and request bodies are not accepted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Authentication required or revoked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '405':
          description: Only GET is allowed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description:
            Verified balance unavailable, stale, invalid or initialization incomplete. No synthetic
            zero balance.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  headers:
    NoStore:
      description: Health and readiness responses must not be cached.
      schema:
        type: string
        const: no-store
    JSONContentType:
      description: JSON representation, even when HEAD omits the body.
      schema:
        type: string
        const: application/json; charset=utf-8
  responses:
    MethodNotAllowed:
      description:
        'Unsupported methods return 405 with Allow: GET, HEAD. Unknown paths return 404. Both
        use standard net/http plain-text error bodies.'
      headers:
        Allow:
          schema:
            type: string
            example: GET, HEAD
      content:
        text/plain:
          schema:
            type: string
    APIFailure:
      description:
        A bounded public error code. No credentials, proof, SQL or internal diagnostic data is
        returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Ready:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ready
    NotReady:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: not_ready
    APIError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - proof_invalid
                - login_requires_reset
                - unauthorized
                - csrf_invalid
                - origin_invalid
                - rate_limited
                - service_unavailable
                - internal_error
                - not_found
                - conflict
                - quota_exceeded
                - wallet_mismatch
                - method_not_allowed
    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - network
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
          maxLength: 128
        network:
          type: string
          const: '-3'
    AnonymousSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - csrfToken
      properties:
        authenticated:
          type: boolean
          const: false
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - csrfToken
        - user
      properties:
        authenticated:
          type: boolean
          const: true
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthSession:
      oneOf:
        - $ref: '#/components/schemas/AnonymousSession'
        - $ref: '#/components/schemas/AuthenticatedSession'
    AuthChallenge:
      type: object
      additionalProperties: false
      required:
        - payload
        - expiresAt
      properties:
        payload:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        expiresAt:
          type: string
          format: date-time
    TonProof:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - domain
        - signature
        - payload
      properties:
        timestamp:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 9007199254740991
            - type: string
              pattern: ^[0-9]{1,19}$
        domain:
          type: object
          additionalProperties: false
          required:
            - lengthBytes
            - value
          properties:
            lengthBytes:
              type: integer
              minimum: 1
              maximum: 128
            value:
              type: string
              minLength: 1
              maxLength: 128
        signature:
          type: string
          format: byte
        payload:
          type: string
          maxLength: 128
    VerifyProofRequest:
      type: object
      additionalProperties: false
      required:
        - address
        - network
        - stateInit
        - proof
      properties:
        address:
          type: string
          maxLength: 128
        network:
          type: string
          const: '-3'
        publicKey:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        stateInit:
          type: string
          format: byte
          maxLength: 21848
        proof:
          $ref: '#/components/schemas/TonProof'
    DraftRecipient:
      type: object
      additionalProperties: false
      required:
        - address
        - amount
        - comment
      properties:
        address:
          type: string
          pattern: '^[^\u0000]*$'
          maxLength: 128
        amount:
          type: string
          pattern: '^[^\u0000]*$'
          maxLength: 128
          description:
            Unfinished exact user input, never interpreted as a JavaScript number or a validated
            payout.
        comment:
          type: string
          pattern: '^[^\u0000]*$'
          maxLength: 500
    DraftInput:
      type: object
      additionalProperties: false
      required:
        - name
        - recipients
      properties:
        name: &a7
          type: string
          minLength: 1
          pattern: '^[^\u0000]*$'
          maxLength: 120
        recipients: &a8
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DraftRecipient'
    DraftUpdate:
      type: object
      additionalProperties: false
      required:
        - version
        - name
        - recipients
      properties:
        version: *a6
        name: *a7
        recipients: *a8
    DraftMetadata:
      type: object
      required:
        - id
        - name
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        version: *a6
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DraftDetail:
      allOf:
        - $ref: '#/components/schemas/DraftMetadata'
        - type: object
          required:
            - recipients
          properties:
            recipients: *a8
    DraftList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DraftMetadata'
    PreparationInput:
      type: object
      additionalProperties: false
      required:
        - address
        - network
        - maxMessages
        - recipients
      properties:
        address:
          type: string
          maxLength: 128
        network:
          type: string
          const: '-3'
        maxMessages:
          type: integer
          minimum: 1
          maximum: 255
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/DraftRecipient'
          maxItems: 200
    PreparationRow:
      type: object
      additionalProperties: false
      required:
        - canonical
        - duplicate
        - errors
        - warnings
      properties:
        canonical:
          type:
            - string
            - 'null'
          maxLength: 128
        duplicate:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    PreparationPart:
      type: object
      additionalProperties: false
      required:
        - firstRecipient
        - recipientCount
        - totalNano
      properties:
        firstRecipient:
          type: integer
          minimum: 0
          maximum: 199
        recipientCount:
          type: integer
          minimum: 1
          maximum: 200
        totalNano:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 40
    PreparationReport:
      type: object
      additionalProperties: false
      required:
        - network
        - address
        - valid
        - totalNano
        - serviceFeeNano
        - maxMessages
        - rows
        - errors
        - parts
        - executable
        - balanceStatus
        - networkFeeStatus
      properties:
        network:
          type: string
          const: '-3'
        address:
          type: string
          maxLength: 128
        valid:
          type: boolean
        totalNano:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 40
        serviceFeeNano:
          type: string
          const: '0'
        maxMessages:
          type: integer
          minimum: 1
          maximum: 255
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PreparationRow'
          maxItems: 200
        errors:
          type: array
          items:
            type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PreparationPart'
          maxItems: 200
        executable:
          type: boolean
          const: false
        balanceStatus:
          type: string
          const: not_checked
        networkFeeStatus:
          type: string
          const: not_estimated
    BalanceReport:
      type: object
      additionalProperties: false
      required:
        - address
        - network
        - balanceNano
        - accountStatus
        - blockSeqno
        - blockRootHash
        - blockTime
        - checkedAt
        - expiresAt
        - executable
        - networkFeeStatus
      description:
        Proof-verified testnet native balance. Unix-second timestamps, expires within 30
        seconds of block time and check time. Not a fee estimate, balance reservation, spendability
        assertion or authorization to send.
      properties:
        address:
          type: string
          maxLength: 128
        network:
          type: string
          enum:
            - '-3'
        balanceNano:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          maxLength: 37
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - UNINIT
            - FROZEN
            - NON_EXIST
        blockSeqno:
          type: integer
          minimum: 1
          maximum: 4294967295
        blockRootHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        blockTime:
          type: integer
          minimum: 1
          maximum: 4294967295
        checkedAt:
          type: integer
          minimum: 1
          maximum: 4294967295
        expiresAt:
          type: integer
          minimum: 1
          maximum: 4294967295
        executable:
          type: boolean
          enum:
            - false
        networkFeeStatus:
          type: string
          enum:
            - not_estimated
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ton_multisend_testnet
      description:
        Secure host-only HTTPS session. Explicit loopback development uses
        ton_multisend_testnet_dev. Anonymous login sessions are issued before authentication.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description:
        Browser-bound secret returned by GET /api/auth/session. Mutating requests must also
        match configured Origin.
